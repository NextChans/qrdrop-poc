<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5567ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QRDrop" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <title>QRDrop — 보내기</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="wrap">
      <h1>📤 보내기 <a href="/" style="font-size:13px">홈</a></h1>

      <div class="panel">
        <label>사진 선택</label>
        <input id="file" type="file" accept="image/*" />
      </div>

      <div class="panel">
        <h2>전송 설정 (대역폭 튜닝)</h2>
        <div class="row">
          <div>
            <label>최대 해상도: <span id="dimVal" class="val">480</span>px</label>
            <input id="dim" type="range" min="240" max="1200" step="40" value="480" />
          </div>
          <div>
            <label>JPEG 화질: <span id="qVal" class="val">0.55</span></label>
            <input id="q" type="range" min="0.3" max="0.9" step="0.05" value="0.55" />
          </div>
        </div>
        <div class="row">
          <div>
            <label>청크 크기: <span id="chunkVal" class="val">700</span> bytes</label>
            <input id="chunk" type="range" min="200" max="1500" step="50" value="700" />
          </div>
          <div>
            <label>프레임레이트: <span id="fpsVal" class="val">8</span> fps</label>
            <input id="fps" type="range" min="1" max="20" step="1" value="8" />
          </div>
        </div>
        <div class="row">
          <div>
            <label>QR 오류정정(ECC)</label>
            <select id="ecc">
              <option value="L">L (데이터 많음/덜 견고)</option>
              <option value="M" selected>M (권장)</option>
              <option value="Q">Q</option>
              <option value="H">H (적음/견고)</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div>
            <label><input type="checkbox" id="encToggle" /> 🔒 암호화 전송 (AES-256-GCM)</label>
            <div id="pwRow" style="display:none;margin-top:8px">
              <input id="sendPw" type="password" placeholder="비밀번호 (긴 패스프레이즈 권장)" autocomplete="off" />
              <div class="muted" style="margin-top:6px">수신자와 따로 공유한 같은 비밀번호로만 복원됩니다. 보안은 비밀번호 강도에 달려 있습니다.</div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <button id="start" disabled>전송 시작</button>
        <button id="stop" class="secondary" disabled>정지</button>
        <div id="estimate" class="stat" style="margin-top:10px"></div>
      </div>

      <div id="qrStage"><canvas id="qrCanvas"></canvas></div>
      <div id="sendStat" class="stat" style="text-align:center;margin-top:10px"></div>
    </div>
    <script type="module" src="/src/send.ts"></script>
  </body>
</html>
