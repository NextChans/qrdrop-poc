<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>QRDrop POC</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="wrap">
      <h1>📷 QRDrop — QR 시퀀스 사진 전송 POC</h1>
      <p class="muted">인터넷 없이 화면↔카메라로 사진을 전송하는 컨셉의 기술 검증.</p>
      <div class="home-links">
        <a href="/send.html">📤 보내기 (Send)</a>
        <a href="/receive.html">📥 받기 (Receive)</a>
      </div>
      <p class="muted" style="margin-top:20px">
        한 폰에서 <b>보내기</b>로 사진을 선택하면 QR 애니메이션이 표시됩니다.<br />
        다른 폰에서 <b>받기</b>로 그 화면을 카메라로 비추면 사진이 복원됩니다.
      </p>
    </div>
  </body>
</html>
